<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>从面部特征到疲劳分类 · Enjing Jiang</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17283f;font:16px/1.8 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:48px 24px}h1{font-size:clamp(28px,5vw,44px);line-height:1.25}h2{font-size:23px}a{color:#126c97}header{border-bottom:1px solid #ccd7e3;padding-bottom:25px}.label{color:#11798a;font-weight:700;letter-spacing:2px}.card{background:white;border:1px solid #dce3ec;border-radius:18px;padding:24px;margin:20px 0}.notice{background:#fff4de;padding:16px;border-left:4px solid #c69329}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}button,select,input{font:inherit;padding:8px;border:1px solid #b8cbd7;border-radius:8px;max-width:100%}button{cursor:pointer;background:#e6f2f5;margin:4px}button:focus-visible{outline:3px solid #137da0}canvas{width:100%;height:auto;background:#f8fafc;border-radius:12px}label{display:block;margin:10px 0}footer{margin-top:40px;color:#667788}small{color:#667788}code{overflow-wrap:anywhere}.stat{font-size:24px;color:#08768a}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}input[type=range]{width:100%}</style><main><header><div class="label">ENJING JIANG / RESEARCH PORTFOLIO</div><h1>从面部特征到疲劳分类</h1><p>PLOS ONE · DRN-RF 研究流程与评价方法</p><a href="README.md">项目说明与复现边界</a></header><p class="notice">论文方法展示，无训练源码和权重，不提供实时疲劳诊断。论文报告准确率 94.2%，本页未复现该结果。</p><section class="card"><h2>点击查看研究流程</h2><div id="buttons"></div><h3 id="stage"></h3><p id="detail"></p></section><section class="card"><h2>评价指标练习：教学示例</h2><p>正类 = 疲劳。下面的数字为人工示例，不来自论文。</p><div class="grid"><label>TP 真正例<input id="tp" type="number" min="0" step="1" value="42"></label><label>FP 假正例<input id="fp" type="number" min="0" step="1" value="8"></label><label>FN 假负例<input id="fn" type="number" min="0" step="1" value="12"></label><label>TN 真负例<input id="tn" type="number" min="0" step="1" value="38"></label></div><p id="metrics"></p></section><section class="card"><a href="https://doi.org/10.1371/journal.pone.0320780">阅读论文</a> · <a href="https://doi.org/10.1371/journal.pone.0320780.s001">出版社补充材料</a></section><footer>研究材料整理与交互展示 · 2026 · 页面无账号、无追踪、无需 API Key。论文结果与演示数据分别标注。</footer></main><script>const steps=[['样本与标签','KSS 量表标签与面部样本对齐。先确定样本单位、类别阈值与被试划分，避免同人数据泄漏。'],['视觉特征','人脸检测后定位 68 个面部关键点，组织几何特征；这与端到端直接输入原始视频的模型不同。'],['预处理与筛选','3σ、Min-Max、Monte Carlo 与 RFECV。所有由数据估计的处理必须只在相应训练折拟合。'],['DRN → RF','利用折外预测构造第二层输入。展示的是论文 Stacking 思路，不是已恢复的训练实现。'],['评价与边界','对照基线并检查类别召回、跨人泛化与误报成本；94.2% 不能脱离实验设置推广到工业现场。']];steps.forEach((s,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+s[0];b.onclick=()=>{document.getElementById('stage').textContent=s[0];document.getElementById('detail').textContent=s[1]};document.getElementById('buttons').append(b);if(!i)b.click()});function calc(){let a=['tp','fp','fn','tn'].map(id=>Number(document.getElementById(id).value)),out=document.getElementById('metrics');if(a.some(v=>!Number.isInteger(v)||v<0)){out.textContent='请输入非负整数';return;}let[t,p,n,z]=a,f=(x,y)=>y?(100*x/y).toFixed(1)+'%':'未定义';out.textContent=`Accuracy ${f(t+z,t+p+n+z)} · Precision ${f(t,t+p)} · Recall ${f(t,t+n)} · F1 ${f(2*t,2*t+p+n)}`;}['tp','fp','fn','tn'].forEach(id=>document.getElementById(id).oninput=calc);calc();</script></html>
